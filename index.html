
<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revision Target — PDF Test</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#f3f5fa;color:#172033;font-family:system-ui,sans-serif}
.wrap{max-width:760px;margin:auto}
header,.panel,.question,.result{background:white;border-radius:15px;padding:16px;margin-bottom:13px;box-shadow:0 3px 12px #1720330b}
h1{font-size:1.4rem;margin:0 0 7px}
h2{font-size:1.1rem;margin-top:0}
.muted{color:#596579;line-height:1.5}
input[type=file]{width:100%;padding:10px;border:1px solid #ccd3df;border-radius:9px;margin:8px 0 12px}
button{background:#2457d6;color:white;border:0;border-radius:10px;padding:12px 15px;font-size:1rem;font-weight:650}
button:disabled{opacity:.4}
.secondary{background:#e9eefb;color:#1e3a8a}
.status{background:#eef3ff;border-radius:9px;padding:10px;white-space:pre-wrap;margin-top:10px}
.hidden{display:none!important}
.meta{display:flex;justify-content:space-between;gap:10px;color:#596579;font-size:.9rem}
.qtext{white-space:pre-wrap;line-height:1.65;font-weight:650;margin:14px 0}
.option{display:flex;gap:10px;border:1px solid #d9deea;border-radius:11px;padding:12px;margin:8px 0;line-height:1.5}
.option:has(input:checked){border-color:#2457d6;background:#eef3ff}
.option input{margin-top:5px}
.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:15px}
.score{font-size:1.7rem;font-weight:800}
.small{font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Revision Target</h1>
<div class="muted">PDF चुनें — प्रश्न और अंत की Answer Key से टेस्ट बनाने की कोशिश होगी।</div>
</header>

<section class="panel" id="uploadPanel">
<h2>PDF से टेस्ट शुरू करें</h2>
<input id="pdfFile" type="file" accept=".pdf,application/pdf">
<button id="readBtn">PDF पढ़ें</button>
<div id="status" class="status">पहले PDF चुनें।</div>
<p class="muted small">यह पेज टेक्स्ट वाली PDF के लिए है। स्कैन/फोटो वाली PDF में OCR की जरूरत हो सकती है।</p>
</section>

<section id="testPanel" class="hidden">
<div class="question">
<div class="meta"><span id="progress"></span><span id="timer"></span></div>
<div id="qtext" class="qtext"></div>
<div id="options"></div>
<div class="actions">
<button id="prevBtn" class="secondary">पिछला</button>
<button id="nextBtn">अगला</button>
<button id="submitBtn" class="hidden">टेस्ट जमा करें</button>
</div>
</div>
</section>
<section id="resultPanel" class="result hidden"></section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
if(window.pdfjsLib)
 pdfjsLib.GlobalWorkerOptions.workerSrc=
 "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const $=id=>document.getElementById(id);
let questions=[],answerKey={},selected={},index=0,timer=null,secs=20,done=false;

function say(t){$("status").textContent=t}
function norm(s){
 return s.replace(/\u00a0/g," ").replace(/\r/g,"\n")
 .replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim();
}

async function pdfText(file){
 const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
 let out="";
 for(let p=1;p<=pdf.numPages;p++){
  const page=await pdf.getPage(p),c=await page.getTextContent();
  let line="",y0=null;
  for(const it of c.items){
   if(!it.str)continue;
   let y=it.transform?it.transform[5]:null;
   if(y0!==null&&y!==null&&Math.abs(y-y0)>3)line+="\n";
   else if(line&&!line.endsWith("\n"))line+=" ";
   line+=it.str;y0=y;
  }
  out+="\n"+line+"\n";
 }
 return norm(out);
}

function parseKey(text){
 const k={};
 for(const line of text.split("\n")){
  let m=line.trim().match(/^(\d{1,3})\s*[\.\)\-:]\s*[\(\[]?([A-D])[\)\]]?\s*$/i);
  if(m)k[+m[1]]=m[2].toUpperCase();
 }
 const re=/(?:^|\s)(\d{1,3})\s*[\.\)]\s*([A-D])(?=\s|$)/g;
 let m;
 while((m=re.exec(text))!==null){
  let n=+m[1];
  if(n>0&&n<1000)k[n]=m[2].toUpperCase();
 }
 return k;
}

function parseQs(text){
 const starts=[...text.matchAll(/प्रश्न\s*(\d{1,3})\s*[\.\:।]\s*/g)];
 const out=[];
 for(let i=0;i<starts.length;i++){
  let a=starts[i].index;
  let b=i+1<starts.length?starts[i+1].index:text.length;
  let block=text.slice(a,b).trim();
  block=block.replace(/\n\s*(?:उत्तर\s*कुंजी|answer\s*key|उत्तरमाला)\b[\s\S]*$/i,"").trim();

  const optRe=/(?:^|\n|\s)\(\s*([A-D])\s*\)\s*/g;
  const ms=[...block.matchAll(optRe)],opts={};
  for(let j=0;j<ms.length;j++){
   const label=ms[j][1].toUpperCase();
   const st=ms[j].index+ms[j][0].length;
   const en=j+1<ms.length?ms[j+1].index:block.length;
   opts[label]=block.slice(st,en).trim().replace(/\s*\n\s*/g," ");
  }
  let qtext=ms.length?block.slice(0,ms[0].index):block;
  qtext=qtext.replace(/^प्रश्न\s*\d{1,3}\s*[\.\:।]\s*/,"").trim();
  if(qtext&&["A","B","C","D"].every(x=>opts[x]))
   out.push({n:+starts[i][1],text:qtext,opts});
 }
 return out;
}

$("readBtn").onclick=async()=>{
 const file=$("pdfFile").files[0];
 if(!file){say("पहले PDF फ़ाइल चुनें।");return}
 if(!window.pdfjsLib){say("PDF लाइब्रेरी लोड नहीं हुई। इंटरनेट चालू करके पेज फिर खोलें।");return}

 $("readBtn").disabled=true;
 say("PDF पढ़ी जा रही है… कृपया प्रतीक्षा करें।");
 try{
  const text=await pdfText(file);
  let keyStart=text.search(/(?:उत्तर\s*कुंजी|answer\s*key|उत्तरमाला)/i);
  let key=parseKey(keyStart>=0?text.slice(keyStart):text);
  questions=parseQs(text).filter(q=>key[q.n]);
  answerKey=key;

  if(!questions.length){
   say("प्रश्न या Answer Key पहचान नहीं पाए। जाँचें कि PDF में टेक्स्ट चुना जा सकता है और Answer Key जैसे 1. A के रूप में है। स्कैन PDF के लिए OCR चाहिए।");
   return;
  }
  selected={};index=0;done=false;
  $("resultPanel").classList.add("hidden");
  $("testPanel").classList.remove("hidden");
  say("तैयार! "+questions.length+" प्रश्न Answer Key से मिलाए गए।");
  render();
  $("testPanel").scrollIntoView({behavior:"smooth"});
 }catch(e){
  say("PDF पढ़ने में समस्या हुई। टेक्स्ट वाली PDF आज़माएँ।");
 }finally{
  $("readBtn").disabled=false;
 }
};

function stop(){if(timer)clearInterval(timer);timer=null}
function startTimer(){
 stop();secs=20;
 $("timer").textContent="समय: "+secs+" सेकंड";
 timer=setInterval(()=>{
  secs--;
  $("timer").textContent="समय: "+secs+" सेकंड";
  if(secs<=0){
   stop();
   if(index<questions.length-1){index++;render()}
   else submit();
  }
 },1000);
}

function render(){
 if(done||!questions.length)return;
 let q=questions[index];
 $("progress").textContent=`प्रश्न ${index+1} / ${questions.length}`;
 $("qtext").textContent=`प्रश्न ${q.n}. ${q.text}`;
 $("options").innerHTML="";
 for(const k of ["A","B","C","D"]){
  let lab=document.createElement("label");lab.className="option";
  let inp=document.createElement("input");
  inp.type="radio";inp.name="answer";inp.value=k;
  inp.checked=selected[q.n]===k;
  inp.onchange=()=>selected[q.n]=k;
  let span=document.createElement("span");
  span.textContent=`(${k}) ${q.opts[k]}`;
  lab.append(inp,span);$("options").append(lab);
 }
 $("prevBtn").disabled=index===0;
 $("nextBtn").classList.toggle("hidden",index===questions.length-1);
 $("submitBtn").classList.toggle("hidden",index!==questions.length-1);
 startTimer();
}

$("prevBtn").onclick=()=>{if(index>0){index--;render()}};
$("nextBtn").onclick=()=>{if(index<questions.length-1){index++;render()}};
$("submitBtn").onclick=submit;

function submit(){
 if(done)return;
 done=true;stop();
 let correct=0,wrong=0,blank=0;
 for(const q of questions){
  if(!selected[q.n])blank++;
  else if(selected[q.n]===answerKey[q.n])correct++;
  else wrong++;
 }
 let score=correct*2-wrong/3;
 $("testPanel").classList.add("hidden");
 $("resultPanel").classList.remove("hidden");
 const res=$("resultPanel");
 res.innerHTML=`<h2>टेस्ट परिणाम</h2>
 <div class="score">${score.toFixed(2)} अंक</div>
 <p>सही: ${correct} · गलत: ${wrong} · छोड़े: ${blank} · कुल: ${questions.length}</p>
 <p>सही उत्तर +2 · गलत उत्तर −⅓</p><h3>उत्तर जाँच</h3>
 <div id="review"></div><button id="restart">नया टेस्ट</button>`;
 const review=$("review");
 questions.forEach((q,i)=>{
  let p=document.createElement("p");
  p.textContent=`${i+1}. आपका उत्तर: ${selected[q.n]||"नहीं दिया"} | सही उत्तर: ${answerKey[q.n]} — ${selected[q.n]===answerKey[q.n]?"सही":"गलत/छोड़ा"}`;
  review.append(p);
 });
 $("restart").onclick=()=>{
  questions=[];answerKey={};selected={};$("pdfFile").value="";
  res.classList.add("hidden");say("नई PDF चुनें।");
  $("uploadPanel").scrollIntoView({behavior:"smooth"});
 };
 res.scrollIntoView({behavior:"smooth"});
}
</script>
</body>
</html>
